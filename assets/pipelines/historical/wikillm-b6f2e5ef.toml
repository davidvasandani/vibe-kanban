name = "WikiLLM"
description = "Knowledge-augmented dev flow: recall prior knowledge before planning and enrich the knowledge base after shipping."

[[stage]]
id = "spec"
label = "Create spec"
default_enabled = true
prompt = "Write a technical spec for this task before implementing and save it to `specs/vk/<task-id>/technical-spec.md`, replacing `<task-id>` with the current task's identifier from the task or task branch."

[[stage]]
id = "recall-knowledge"
label = "Recall prior knowledge"
default_enabled = true
prompt = "Before planning, recall what this project already knows: search the project knowledge base for pages relevant to this task and distill the matches into `specs/vk/<task-id>/prior-knowledge.md`, replacing `<task-id>` with the current task's identifier from the task or task branch, for the spec and plan stages to build on. Read-only on the knowledge base; if it is empty (first task), note that and continue."

[[stage]]
id = "plan"
label = "Create plan"
default_enabled = true
prompt = "Write a step-by-step implementation plan and save it to `specs/vk/<task-id>/implementation-plan.md`, replacing `<task-id>` with the current task's identifier from the task or task branch."

[[stage]]
id = "plan-review"
label = "Review plan"
default_enabled = false
prompt = "Have the implementation plan reviewed (e.g. a codex plan review, read-only) and resolve blockers before writing code."

[[stage]]
id = "wait-for-approval"
label = "Wait for approval"
default_enabled = false
prompt = "Pause for operator approval at this point: commit the work so far, then stop and wait for the operator's decision or instructions before continuing to later stages — do not advance on your own until the operator responds."

[[stage]]
id = "code-review"
label = "Review via Codex"
default_enabled = true
prompt = "After implementing, run an independent Codex review of the task's diff (the `codex-review` skill / Codex CLI), iterating until it reports no significant findings. Address confirmed findings and re-verify before marking the task ready."

[[stage]]
id = "update-docs"
label = "Update documentation"
default_enabled = false
prompt = "Update the documentation affected by this change so the docs match what shipped, and commit it before marking the task ready."

[[stage]]
id = "enrich-knowledge"
label = "Enrich knowledge base"
default_enabled = true
prompt = "Once the change is implemented (and reviewed/documented, if those stages ran), distill any reusable knowledge from what shipped into the project knowledge base: add or update topic pages, tag each with this task's id, refresh the index, and commit the knowledge base before marking the task ready. If nothing reusable emerged, say so (\"no new knowledge to record\") rather than writing filler."

[[stage]]
id = "merge"
label = "Merge to base"
default_enabled = false
prompt = "When the work is implemented and reviewed, merge this task's branch into the base branch. Immediately before merging a constitution change, inspect the latest base-branch tip for the highest existing principle number; if this task's provisional number is already present, renumber the unmerged principle to the next free number and update its internal references before merging. Never renumber an already-merged principle to resolve a collision."

[[stage]]
id = "pr"
label = "Open pull request"
default_enabled = false
prompt = "When the work is implemented and reviewed, open a pull request for this task against the base branch."
