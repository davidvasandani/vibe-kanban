# Audits third-party artifacts that Vibe Kanban pins by URL but does **not**
# fetch itself. The bundled Slack MCP entry tells each agent to run
# `npx -y <GitHub release tarball>`, so npm — not VK — does the download, and
# no digest is checked at install time. GitHub permits a release asset to be
# replaced under an existing tag, so the recorded SHA-256 is only meaningful if
# something re-checks it on a schedule. That is this job.
name: Pinned artifacts

on:
  schedule:
    # Daily at 05:00 UTC. GitHub schedules are best-effort and may be delayed.
    - cron: "0 5 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: nightly-2025-12-04

jobs:
  slack-mcp-launcher-digest:
    name: Slack MCP launcher digest
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust
        uses: ./.github/actions/cargo-checks-common-setup
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          cache-key: pinned-artifacts-${{ runner.os }}-${{ runner.arch }}

      - name: Verify the pinned Slack MCP launcher matches its recorded digest
        id: digest
        run: cargo test -p executors slack_pinned_launcher_matches_recorded_digest -- --ignored --nocapture

      - name: Open or update the Slack launcher audit incident
        if: steps.digest.outcome == 'failure'
        uses: actions/github-script@v8
        with:
          script: |
            const title = '[security] Pinned Slack MCP launcher digest audit failed';
            const runUrl =
              `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}` +
              `/actions/runs/${context.runId}`;
            const { data: search } = await github.rest.search.issuesAndPullRequests({
              q:
                `repo:${context.repo.owner}/${context.repo.repo} is:issue is:open ` +
                `in:title "${title}"`,
              per_page: 10,
            });
            const existing = search.items.find((issue) => issue.title === title);
            const evidence =
              `The pinned Slack MCP launcher digest audit failed in ` +
              `[workflow run ${context.runId}](${runUrl}).\n\n` +
              `Treat the GitHub release asset as potentially replaced. ` +
              `Compare it with \`SLACK_MCP_LAUNCHER_SHA256\` in ` +
              `\`crates/executors/src/mcp_config.rs\`. Do not re-upload the ` +
              `existing release asset: publish a new \`-vk.<n+1>\` tag and ` +
              `move the URL, digest, documentation, and Renovate metadata ` +
              `together.`;
            if (existing) {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: existing.number,
                body: evidence,
              });
            } else {
              await github.rest.issues.create({
                ...context.repo,
                title,
                body:
                  `${evidence}\n\nThis issue is intentionally not closed by a ` +
                  `later green run; a maintainer must investigate the ` +
                  `supply-chain incident and close it explicitly.`,
              });
            }
