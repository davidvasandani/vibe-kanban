# Dispatch davidvasandani/homelab's vibe-kanban-deploy workflow once a release
# for a commit on main is published. Called by release.yml after its publish
# job, so homelab is only asked to deploy a commit whose release assets exist:
# homelab downloads that release instead of compiling the fork.
#
# Keep this fork-specific workflow during upstream syncs so the homelab
# dispatch remains the deployment source of truth.
#
# Requires repo secret HOMELAB_DEPLOY_TOKEN: a fine-grained PAT on
# davidvasandani/homelab with `Contents: Read and write` (authorizes the
# repository_dispatch REST call).
name: Trigger homelab CD

on:
  workflow_call:
    inputs:
      sha:
        description: Released commit (full sha)
        required: true
        type: string
      tag:
        description: Release tag (build-<12 hex>)
        required: true
        type: string
  workflow_dispatch:
    inputs:
      sha:
        description: Released commit (full sha)
        required: true
        type: string
      tag:
        description: Release tag (build-<12 hex>)
        required: true
        type: string

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch vibe-kanban-deploy to homelab
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.HOMELAB_DEPLOY_TOKEN }}
          repository: davidvasandani/homelab
          event-type: vibe-kanban-deploy
          client-payload: |
            {
              "sha": "${{ inputs.sha }}",
              "ref": "main",
              "tag": "${{ inputs.tag }}",
              "checksums_url": "${{ github.server_url }}/${{ github.repository }}/releases/download/${{ inputs.tag }}/SHA256SUMS"
            }
