[package]
name = "worktree-manager"
version = "0.1.43"
edition = "2024"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
db = { path = "../db" }
git = { path = "../git" }
sqlx = "0.8.6"
utils = { path = "../utils" }
