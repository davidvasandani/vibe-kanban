[package]
name = "services"
version = "0.1.43"
edition = "2024"

[features]
default = []
cloud = []
qa-mode = ["executors/qa-mode"]

[dependencies]
indicatif = "0.17"
api-types = { path = "../api-types" }
relay-types = { path = "../relay-types" }
utils = { path = "../utils" }
git = { path = "../git" }
git-host = { path = "../git-host" }
executors = { path = "../executors" }
db = { path = "../db" }
worktree-manager = { path = "../worktree-manager" }
tokio = { workspace = true }
tokio-util = { version = "0.7", features = ["io"] }
serde = { workspace = true }
serde_json = { workspace = true }
toml = "0.8"
url = "2.5"
anyhow = { workspace = true }
tracing = { workspace = true }
sqlx = { version = "0.8.6", features = ["runtime-tokio", "tls-rustls-aws-lc-rs", "sqlite", "sqlite-preupdate-hook", "chrono", "uuid"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
ts-rs = { workspace = true }
dirs = "5.0"
async-trait = { workspace = true }
rust-embed = "8.2"
ignore = "0.4"
bytes = "1"
tokio-tungstenite = { version = "0.26" }
command-group = { version = "5.0", features = ["with-tokio"] }
notify-rust = "4.11"
os_info = "3.12.0"
reqwest = { workspace = true }
regex = "1.11.1"
json-patch = "2.0"
backon = "1.5.1"
thiserror = { workspace = true }
futures = "0.3.31"
tokio-stream = "0.1.17"
strum = "0.27.2"
strum_macros = "0.27.2"
notify = "8.2.0"
notify-debouncer-full = "0.5.0"
dunce = "1.0"
dashmap = "6.1"
once_cell = "1.20"
sha2 = "0.10"
aes-gcm = { workspace = true }
base64 = "0.22"
rand = "0.8"
fst = "0.4"
# CLI tool installer archive handling (services/cli_tools.rs)
zip = { version = "2", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1.0"
xz2 = { version = "0.1", features = ["static"] }
moka = { version = "0.12", features = ["future"] }
mime_guess = "2.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3"
